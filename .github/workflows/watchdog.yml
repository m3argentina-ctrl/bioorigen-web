name: Watchdog flota

# RESPALDO del watchdog de la nube. El disparador principal es Upstash QStash
# cada 5 min (ver src/lib/qstash.ts): el "*/5" de GitHub Actions en la práctica
# corría cada ~5 h. Esta corrida además crea/confirma la programación en QStash.
# También se puede correr a mano desde la pestaña Actions.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# No encadenar ejecuciones si una se solapa con la siguiente.
concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint del watchdog
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Opcional: sobreescribe la URL si cambia el dominio del backend.
          WATCHDOG_URL: ${{ vars.WATCHDOG_URL }}
        run: |
          URL="${WATCHDOG_URL:-https://bioorigen-web.vercel.app/api/cron/watchdog}"
          echo "POST $URL"
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          # Falla el job si la nube no respondió 2xx (para que se vea en Actions).
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi
